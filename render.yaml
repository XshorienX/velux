services:
  - type: web
    name: velux-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/ && chmod +x start.sh
    startCommand: ./start.sh
    disk:
      name: mongodb-data
      mountPath: /data/db
      sizeGB: 1
    envVars:
      - key: MONGO_URL
        value: mongodb://127.0.0.1:27017
      - key: DB_NAME
        value: velux
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USERNAME
        value: SHORIEN
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0

  - type: web
    name: velux-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npx serve -s build -l $PORT
    envVars:
      - key: REACT_APP_BACKEND_URL
        sync: false
      - key: NODE_VERSION
        value: 20.18.0